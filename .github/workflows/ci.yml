name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }} # Neon URL hier als Secret hinterlegt

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client (Postgres schema)
        run: npx prisma generate --schema prisma/schema.postgres.prisma

      - name: Run Prisma Migrations (safe, no data loss)
        run: npx prisma migrate deploy --schema prisma/schema.postgres.prisma

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
