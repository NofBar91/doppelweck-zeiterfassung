name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Nur Secrets, KEIN NODE_ENV hier
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # Debug: zeigen, dass die Dateien da sind
      - name: Show workspace
        run: |
          pwd
          ls -la
          ls -la prisma || true

      - name: Install dependencies
        run: npm ci

      # Prisma Client (Postgres-Schema)
      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.postgres.prisma

      # Migrationen einspielen (nur vorhandene; ohne Datenverlust)
      - name: Run Prisma Migrations
        run: npx prisma migrate deploy --schema prisma/schema.postgres.prisma

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
