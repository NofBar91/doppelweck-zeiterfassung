name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: disposable-ci-test-secret-not-for-production
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare isolated test database
        run: npm run test:e2e:prepare
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test driver and administration workflows
        run: npm run e2e
      - name: Upload browser report and responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doppelweck-ui-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
